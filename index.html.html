<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여비 정산 신청서</title>
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=a34eb9367071387b6aa77aee11c5fb04&libraries=services"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

  :root {
    --primary: #2E7D9E;
    --primary-light: #4A9DBF;
    --primary-dark: #1A5F7A;
    --accent: #E8F4F8;
    --bg: #F5F8FA;
    --white: #FFFFFF;
    --text: #2C3E50;
    --text-light: #7F8C8D;
    --border: #D5E8F0;
    --danger: #E74C3C;
    --success: #27AE60;
    --shadow: 0 2px 12px rgba(46,125,158,0.10);
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    color: white;
    padding: 22px 32px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 16px rgba(26,95,122,0.18);
  }
  .header-icon { font-size: 28px; }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .header p { font-size: 12px; opacity: 0.75; margin-top: 2px; }

  /* Main Container */
  .container {
    max-width: 820px;
    margin: 32px auto;
    padding: 0 16px 60px;
  }

  /* Section Card */
  .card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .card-header {
    background: linear-gradient(90deg, var(--accent) 0%, #fff 100%);
    border-bottom: 1.5px solid var(--border);
    padding: 14px 22px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card-header .icon { font-size: 18px; }
  .card-header h2 { font-size: 15px; font-weight: 700; color: var(--primary-dark); }
  .card-body { padding: 22px; }

  /* Form Grid */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .form-grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .form-grid.full { grid-template-columns: 1fr; }

  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label {
    font-size: 12px;
    font-weight: 600;
    color: var(--primary-dark);
    letter-spacing: 0.3px;
  }
  .form-group input, .form-group textarea, .form-group select {
    border: 1.5px solid var(--border);
    border-radius: 7px;
    padding: 9px 13px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
    background: #FAFCFE;
    transition: border 0.2s, box-shadow 0.2s;
    outline: none;
  }
  .form-group input:focus, .form-group textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(46,125,158,0.10);
    background: #fff;
  }
  .form-group textarea { resize: vertical; min-height: 60px; }

  /* Location Input */
  .location-input-wrap {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .location-input-wrap input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    padding: 9px 13px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    background: #FAFCFE;
    outline: none;
    cursor: pointer;
    color: var(--text);
  }
  .location-input-wrap input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(46,125,158,0.10);
  }
  .btn-map {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 7px;
    padding: 9px 14px;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    flex-shrink: 0;
  }
  .btn-map:hover { background: var(--primary-dark); transform: scale(1.05); }

  /* Distance Badge */
  .distance-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--primary-dark);
    margin-top: 10px;
  }

  /* 숙박비/식비 테이블 */
  .expense-table { width: 100%; border-collapse: collapse; }
  .expense-table th {
    background: var(--accent);
    color: var(--primary-dark);
    font-size: 12px;
    font-weight: 700;
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1.5px solid var(--border);
  }
  .expense-table td {
    padding: 10px 8px;
    border-bottom: 1px solid #EEF4F7;
    vertical-align: middle;
  }
  .expense-table td input, .expense-table td textarea {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    background: #FAFCFE;
    outline: none;
    transition: border 0.2s;
  }
  .expense-table td input:focus, .expense-table td textarea:focus {
    border-color: var(--primary);
  }
  .expense-table td textarea { min-height: 44px; resize: vertical; }
  .diff-cell {
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    min-width: 80px;
  }
  .diff-over { color: var(--danger); }
  .diff-ok { color: var(--success); }

  /* 운임 */
  .fare-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto auto;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
    padding: 12px;
    background: #FAFCFE;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .fare-row input {
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    background: #fff;
    outline: none;
    width: 100%;
    transition: border 0.2s;
  }
  .fare-row input:focus { border-color: var(--primary); }
  .fare-row label { font-size: 11px; color: var(--text-light); margin-bottom: 3px; display: block; }

  .btn-add {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--accent);
    color: var(--primary-dark);
    border: 1.5px dashed var(--primary);
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 4px;
  }
  .btn-add:hover { background: #D8EEF5; }

  .btn-remove {
    background: none;
    border: none;
    color: #BDC3C7;
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    transition: color 0.2s;
    line-height: 1;
  }
  .btn-remove:hover { color: var(--danger); }

  /* 합계 */
  .total-row {
    background: linear-gradient(90deg, var(--accent) 0%, #fff 100%);
    border-radius: 8px;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    border: 1px solid var(--border);
  }
  .total-row .label { font-size: 14px; font-weight: 600; color: var(--primary-dark); }
  .total-row .amount { font-size: 20px; font-weight: 700; color: var(--primary-dark); }

  /* 제출 버튼 */
  .btn-print {
    width: 100%;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 4px 16px rgba(46,125,158,0.25);
    transition: transform 0.15s, box-shadow 0.15s;
    margin-top: 8px;
  }
  .btn-print:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(46,125,158,0.30); }

  /* 모달 - 지도 */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: white;
    border-radius: 14px;
    width: 92vw;
    max-width: 680px;
    max-height: 90vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .modal-header {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    color: white;
    padding: 16px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-header h3 { font-size: 16px; font-weight: 700; }
  .modal-close {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    font-size: 20px;
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .modal-close:hover { background: rgba(255,255,255,0.35); }

  .modal-search {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }
  .modal-search input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    transition: border 0.2s;
  }
  .modal-search input:focus { border-color: var(--primary); }
  .modal-search button {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: background 0.2s;
  }
  .modal-search button:hover { background: var(--primary-dark); }

  #map { width: 100%; height: 380px; }

  .modal-result {
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .modal-result .place-info { font-size: 13px; color: var(--text-light); }
  .modal-result .place-name { font-size: 15px; font-weight: 700; color: var(--text); }
  .btn-confirm {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .btn-confirm:hover { background: var(--primary-dark); }

  /* 인쇄 모달 */
  .print-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 2000;
    align-items: center;
    justify-content: center;
  }
  .print-modal-overlay.active { display: flex; }
  .print-modal {
    background: white;
    border-radius: 14px;
    width: 95vw;
    max-width: 760px;
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
  }
  .print-modal-header {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    color: white;
    padding: 16px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 1;
  }
  .print-modal-header h3 { font-size: 16px; font-weight: 700; }
  .print-modal-actions { display: flex; gap: 10px; align-items: center; }
  .btn-do-print {
    background: white;
    color: var(--primary-dark);
    border: none;
    border-radius: 8px;
    padding: 8px 20px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  #print-content {
    padding: 32px;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .print-title {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 24px;
    color: var(--text);
    letter-spacing: 2px;
    padding-bottom: 14px;
    border-bottom: 2.5px solid var(--primary);
  }
  .print-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 18px;
    font-size: 13px;
  }
  .print-table th, .print-table td {
    border: 1px solid #B0C8D4;
    padding: 8px 12px;
  }
  .print-table th {
    background: var(--accent);
    color: var(--primary-dark);
    font-weight: 700;
    text-align: left;
    width: 120px;
  }
  .print-section-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--primary-dark);
    margin: 18px 0 8px;
    padding-left: 8px;
    border-left: 4px solid var(--primary);
  }
  .print-total {
    text-align: right;
    font-size: 16px;
    font-weight: 700;
    color: var(--primary-dark);
    margin-top: 12px;
    padding: 10px 16px;
    background: var(--accent);
    border-radius: 6px;
  }
  .print-sign {
    margin-top: 30px;
    display: flex;
    justify-content: flex-end;
    gap: 40px;
    font-size: 13px;
  }
  .sign-box {
    text-align: center;
    border: 1px solid #B0C8D4;
    padding: 12px 24px;
    min-width: 100px;
    border-radius: 4px;
  }
  .sign-box .sign-label { font-size: 11px; color: var(--text-light); margin-bottom: 28px; }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-grid.three { grid-template-columns: 1fr 1fr; }
    .fare-row { grid-template-columns: 1fr 1fr; }
    .container { margin: 16px auto; }
    #map { height: 280px; }
  }

  @media print {
    body * { visibility: hidden; }
    #print-content, #print-content * { visibility: visible; }
    #print-content { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
    .print-modal-header { display: none; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">✈️</div>
  <div>
    <h1>여비 정산 신청서</h1>
    <p>공무 국내 출장 여비 정산 신청</p>
  </div>
</div>

<div class="container">

  <!-- 기본 정보 -->
  <div class="card">
    <div class="card-header">
      <span class="icon">👤</span>
      <h2>기본 정보</h2>
    </div>
    <div class="card-body">
      <div class="form-grid three">
        <div class="form-group">
          <label>소속</label>
          <input type="text" id="dept" placeholder="예) 운천고등학교">
        </div>
        <div class="form-group">
          <label>직급 (직위)</label>
          <input type="text" id="rank" placeholder="예) 행정과장 (6급)">
        </div>
        <div class="form-group">
          <label>성명</label>
          <input type="text" id="name" placeholder="홍길동">
        </div>
      </div>
      <div class="form-grid" style="margin-top:14px;">
        <div class="form-group">
          <label>출장 일자</label>
          <input type="date" id="trip-date">
        </div>
        <div class="form-group">
          <label>출장 목적</label>
          <input type="text" id="trip-purpose" placeholder="예) 교육행정 협의회 참석">
        </div>
      </div>
    </div>
  </div>

  <!-- 출발지 / 도착지 -->
  <div class="card">
    <div class="card-header">
      <span class="icon">🗺️</span>
      <h2>출발지 / 출장지 (도착지)</h2>
    </div>
    <div class="card-body">
      <div class="form-grid">
        <div class="form-group">
          <label>출발지</label>
          <div class="location-input-wrap">
            <input type="text" id="origin-text" placeholder="지도에서 선택하세요" readonly>
            <button class="btn-map" onclick="openMap('origin')" title="지도에서 선택">🗺️</button>
          </div>
        </div>
        <div class="form-group">
          <label>출장지 (도착지)</label>
          <div class="location-input-wrap">
            <input type="text" id="dest-text" placeholder="지도에서 선택하세요" readonly>
            <button class="btn-map" onclick="openMap('dest')" title="지도에서 선택">🗺️</button>
          </div>
        </div>
      </div>
      <div id="distance-wrap" style="display:none;">
        <div class="distance-badge">
          🚌 <span id="distance-text">계산 중...</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 숙박비 -->
  <div class="card">
    <div class="card-header">
      <span class="icon">🏨</span>
      <h2>숙박비</h2>
    </div>
    <div class="card-body">
      <table class="expense-table">
        <thead>
          <tr>
            <th>구분</th>
            <th>상한액 또는 지급받은 선금 (원)</th>
            <th>실제 소요액 (원)</th>
            <th>차액</th>
            <th>초과지출사유</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style="font-weight:600; font-size:13px; white-space:nowrap;">숙박비</td>
            <td><input type="number" id="lodging-limit" placeholder="0" oninput="calcDiff('lodging')"></td>
            <td><input type="number" id="lodging-actual" placeholder="0" oninput="calcDiff('lodging')"></td>
            <td class="diff-cell" id="lodging-diff">-</td>
            <td><textarea id="lodging-reason" placeholder="초과 시 사유 입력"></textarea></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 식비 -->
  <div class="card">
    <div class="card-header">
      <span class="icon">🍱</span>
      <h2>식비</h2>
    </div>
    <div class="card-body">
      <table class="expense-table">
        <thead>
          <tr>
            <th>구분</th>
            <th>지급받은 금액 (원)</th>
            <th>실제 소요액 (원)</th>
            <th>차액</th>
            <th>초과지출사유</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style="font-weight:600; font-size:13px; white-space:nowrap;">식비</td>
            <td><input type="number" id="meal-limit" placeholder="0" oninput="calcDiff('meal')"></td>
            <td><input type="number" id="meal-actual" placeholder="0" oninput="calcDiff('meal')"></td>
            <td class="diff-cell" id="meal-diff">-</td>
            <td><textarea id="meal-reason" placeholder="초과 시 사유 입력"></textarea></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 운임 -->
  <div class="card">
    <div class="card-header">
      <span class="icon">🚌</span>
      <h2>운임</h2>
    </div>
    <div class="card-body">
      <div id="fare-list"></div>
      <button class="btn-add" onclick="addFare()">＋ 운임 행 추가</button>
      <div class="total-row" style="margin-top:16px;">
        <span class="label">운임 합계</span>
        <span class="amount" id="fare-total">0 원</span>
      </div>
    </div>
  </div>

  <!-- 합계 -->
  <div class="card">
    <div class="card-header">
      <span class="icon">💰</span>
      <h2>여비 합계</h2>
    </div>
    <div class="card-body">
      <div class="total-row">
        <span class="label">총 여비 합계</span>
        <span class="amount" id="grand-total">0 원</span>
      </div>
    </div>
  </div>

  <!-- 인쇄 버튼 -->
  <button class="btn-print" onclick="openPrintModal()">
    📄 여비정산신청서 미리보기 / 인쇄
  </button>

</div>

<!-- 지도 모달 -->
<div class="modal-overlay" id="map-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">위치 선택</h3>
      <button class="modal-close" onclick="closeMap()">✕</button>
    </div>
    <div class="modal-search">
      <input type="text" id="map-search-input" placeholder="장소를 검색하거나 지도를 클릭하세요" onkeydown="if(event.key==='Enter') searchPlace()">
      <button onclick="searchPlace()">검색</button>
    </div>
    <div id="map"></div>
    <div class="modal-result">
      <div>
        <div class="place-name" id="selected-place-name">선택된 장소 없음</div>
        <div class="place-info" id="selected-place-addr"></div>
      </div>
      <button class="btn-confirm" onclick="confirmLocation()">확인</button>
    </div>
  </div>
</div>

<!-- 인쇄 미리보기 모달 -->
<div class="print-modal-overlay" id="print-modal">
  <div class="print-modal">
    <div class="print-modal-header">
      <h3>🖨️ 여비정산신청서 미리보기</h3>
      <div class="print-modal-actions">
        <button class="btn-do-print" onclick="window.print()">🖨️ 인쇄</button>
        <button class="modal-close" onclick="closePrintModal()">✕</button>
      </div>
    </div>
    <div id="print-content"></div>
  </div>
</div>

<script>
  // ===== 전역 변수 =====
  let map, marker, geocoder, ps;
  let currentTarget = null; // 'origin' or 'dest'
  let originData = null;
  let destData = null;
  let selectedPlace = null;
  let fareCount = 0;

  // ===== 카카오맵 초기화 =====
  function initMap() {
    const container = document.getElementById('map');
    const options = {
      center: new kakao.maps.LatLng(37.3498, 127.1051),
      level: 5
    };
    map = new kakao.maps.Map(container, options);
    geocoder = new kakao.maps.services.Geocoder();
    ps = new kakao.maps.services.Places();

    marker = new kakao.maps.Marker({ map: map });

    kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
      const latlng = mouseEvent.latLng;
      marker.setPosition(latlng);
      geocoder.coord2Address(latlng.getLng(), latlng.getLat(), function(result, status) {
        if (status === kakao.maps.services.Status.OK) {
          const addr = result[0].road_address ? result[0].road_address.address_name : result[0].address.address_name;
          selectedPlace = { name: addr, address: addr, lat: latlng.getLat(), lng: latlng.getLng() };
          document.getElementById('selected-place-name').textContent = addr;
          document.getElementById('selected-place-addr').textContent = '지도에서 선택된 위치';
        }
      });
    });
  }

  // ===== 지도 열기/닫기 =====
  function openMap(target) {
    currentTarget = target;
    document.getElementById('modal-title').textContent = target === 'origin' ? '출발지 선택' : '출장지(도착지) 선택';
    document.getElementById('map-search-input').value = '';
    document.getElementById('selected-place-name').textContent = '선택된 장소 없음';
    document.getElementById('selected-place-addr').textContent = '';
    selectedPlace = null;
    document.getElementById('map-modal').classList.add('active');

    setTimeout(() => {
      if (!map) initMap();
      kakao.maps.event.trigger(map, 'resize');
    }, 100);
  }

  function closeMap() {
    document.getElementById('map-modal').classList.remove('active');
  }

  // ===== 장소 검색 =====
  function searchPlace() {
    const keyword = document.getElementById('map-search-input').value.trim();
    if (!keyword) return;
    ps.keywordSearch(keyword, function(data, status) {
      if (status === kakao.maps.services.Status.OK) {
        const place = data[0];
        const latlng = new kakao.maps.LatLng(place.y, place.x);
        map.setCenter(latlng);
        map.setLevel(4);
        marker.setPosition(latlng);
        selectedPlace = { name: place.place_name, address: place.road_address_name || place.address_name, lat: parseFloat(place.y), lng: parseFloat(place.x) };
        document.getElementById('selected-place-name').textContent = place.place_name;
        document.getElementById('selected-place-addr').textContent = place.road_address_name || place.address_name;
      } else {
        alert('검색 결과가 없습니다.');
      }
    });
  }

  // ===== 위치 확정 =====
  function confirmLocation() {
    if (!selectedPlace) { alert('장소를 선택해 주세요.'); return; }
    if (currentTarget === 'origin') {
      originData = selectedPlace;
      document.getElementById('origin-text').value = selectedPlace.name;
    } else {
      destData = selectedPlace;
      document.getElementById('dest-text').value = selectedPlace.name;
    }
    closeMap();
    if (originData && destData) calcDistance();
  }

  // ===== 거리 계산 =====
  function calcDistance() {
    const R = 6371;
    const dLat = (destData.lat - originData.lat) * Math.PI / 180;
    const dLng = (destData.lng - originData.lng) * Math.PI / 180;
    const a = Math.sin(dLat/2) ** 2 + Math.cos(originData.lat * Math.PI/180) * Math.cos(destData.lat * Math.PI/180) * Math.sin(dLng/2) ** 2;
    const dist = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    const distKm = dist.toFixed(1);

    document.getElementById('distance-wrap').style.display = 'block';
    document.getElementById('distance-text').textContent = `${originData.name} → ${destData.name} 직선거리 약 ${distKm}km`;
  }

  // ===== 차액 계산 =====
  function calcDiff(type) {
    const limit = parseFloat(document.getElementById(`${type}-limit`).value) || 0;
    const actual = parseFloat(document.getElementById(`${type}-actual`).value) || 0;
    const diff = actual - limit;
    const el = document.getElementById(`${type}-diff`);
    if (limit === 0 && actual === 0) { el.textContent = '-'; el.className = 'diff-cell'; return; }
    el.textContent = (diff > 0 ? '+' : '') + diff.toLocaleString() + ' 원';
    el.className = 'diff-cell ' + (diff > 0 ? 'diff-over' : 'diff-ok');
    calcGrandTotal();
  }

  // ===== 운임 추가 =====
  function addFare() {
    fareCount++;
    const id = fareCount;
    const div = document.createElement('div');
    div.className = 'fare-row';
    div.id = `fare-row-${id}`;
    div.innerHTML = `
      <div>
        <label>교통수단</label>
        <input type="text" placeholder="예) 버스, KTX, 택시">
      </div>
      <div>
        <label>금액 (원)</label>
        <input type="number" placeholder="0" oninput="calcFareTotal()" id="fare-amount-${id}">
      </div>
      <div style="grid-column: span 1;">
        <label>비고</label>
        <input type="text" placeholder="예) 왕복">
      </div>
      <button class="btn-remove" onclick="removeFare(${id})" title="삭제">✕</button>
    `;
    document.getElementById('fare-list').appendChild(div);
  }

  function removeFare(id) {
    document.getElementById(`fare-row-${id}`).remove();
    calcFareTotal();
  }

  function calcFareTotal() {
    let total = 0;
    document.querySelectorAll('[id^="fare-amount-"]').forEach(el => {
      total += parseFloat(el.value) || 0;
    });
    document.getElementById('fare-total').textContent = total.toLocaleString() + ' 원';
    calcGrandTotal();
  }

  // ===== 총 합계 =====
  function calcGrandTotal() {
    const lodgingActual = parseFloat(document.getElementById('lodging-actual').value) || 0;
    const mealActual = parseFloat(document.getElementById('meal-actual').value) || 0;
    let fareTotal = 0;
    document.querySelectorAll('[id^="fare-amount-"]').forEach(el => {
      fareTotal += parseFloat(el.value) || 0;
    });
    const grand = lodgingActual + mealActual + fareTotal;
    document.getElementById('grand-total').textContent = grand.toLocaleString() + ' 원';
  }

  // ===== 인쇄 미리보기 =====
  function openPrintModal() {
    const dept = document.getElementById('dept').value || '-';
    const rank = document.getElementById('rank').value || '-';
    const name = document.getElementById('name').value || '-';
    const date = document.getElementById('trip-date').value || '-';
    const purpose = document.getElementById('trip-purpose').value || '-';
    const origin = document.getElementById('origin-text').value || '-';
    const dest = document.getElementById('dest-text').value || '-';

    const lodgingLimit = (parseFloat(document.getElementById('lodging-limit').value)||0).toLocaleString();
    const lodgingActual = (parseFloat(document.getElementById('lodging-actual').value)||0).toLocaleString();
    const lodgingReason = document.getElementById('lodging-reason').value || '-';

    const mealLimit = (parseFloat(document.getElementById('meal-limit').value)||0).toLocaleString();
    const mealActual = (parseFloat(document.getElementById('meal-actual').value)||0).toLocaleString();
    const mealReason = document.getElementById('meal-reason').value || '-';

    let fareRows = '';
    document.querySelectorAll('#fare-list .fare-row').forEach(row => {
      const inputs = row.querySelectorAll('input');
      const transport = inputs[0].value || '-';
      const amount = (parseFloat(inputs[1].value)||0).toLocaleString();
      const note = inputs[2].value || '-';
      fareRows += `<tr><td>${transport}</td><td style="text-align:right;">${amount} 원</td><td>${note}</td></tr>`;
    });
    if (!fareRows) fareRows = '<tr><td colspan="3" style="text-align:center;color:#999;">운임 없음</td></tr>';

    const grandTotal = document.getElementById('grand-total').textContent;

    document.getElementById('print-content').innerHTML = `
      <div class="print-title">여 비 정 산 신 청 서</div>
      <div class="print-section-title">■ 기본 정보</div>
      <table class="print-table">
        <tr><th>소속</th><td>${dept}</td><th>직급(직위)</th><td>${rank}</td></tr>
        <tr><th>성명</th><td>${name}</td><th>출장일자</th><td>${date}</td></tr>
        <tr><th>출장목적</th><td colspan="3">${purpose}</td></tr>
        <tr><th>출발지</th><td>${origin}</td><th>출장지</th><td>${dest}</td></tr>
      </table>

      <div class="print-section-title">■ 숙박비</div>
      <table class="print-table">
        <thead><tr><th>구분</th><th>상한액/선금(원)</th><th>실제소요액(원)</th><th>초과지출사유</th></tr></thead>
        <tbody><tr><td>숙박비</td><td style="text-align:right;">${lodgingLimit} 원</td><td style="text-align:right;">${lodgingActual} 원</td><td>${lodgingReason}</td></tr></tbody>
      </table>

      <div class="print-section-title">■ 식비</div>
      <table class="print-table">
        <thead><tr><th>구분</th><th>지급받은금액(원)</th><th>실제소요액(원)</th><th>초과지출사유</th></tr></thead>
        <tbody><tr><td>식비</td><td style="text-align:right;">${mealLimit} 원</td><td style="text-align:right;">${mealActual} 원</td><td>${mealReason}</td></tr></tbody>
      </table>

      <div class="print-section-title">■ 운임</div>
      <table class="print-table">
        <thead><tr><th>교통수단</th><th>금액</th><th>비고</th></tr></thead>
        <tbody>${fareRows}</tbody>
      </table>

      <div class="print-total">총 여비 합계: ${grandTotal}</div>

      <div class="print-sign">
        <div class="sign-box"><div class="sign-label">신청인</div>${name}</div>
        <div class="sign-box"><div class="sign-label">확인</div>&nbsp;</div>
        <div class="sign-box"><div class="sign-label">결재</div>&nbsp;</div>
      </div>

      <p style="margin-top:24px; font-size:11px; color:#999; text-align:center;">
        위와 같이 여비를 정산하여 신청합니다. &nbsp; 신청일자: ${new Date().toLocaleDateString('ko-KR')}
      </p>
    `;
    document.getElementById('print-modal').classList.add('active');
  }

  function closePrintModal() {
    document.getElementById('print-modal').classList.remove('active');
  }

  // 초기 운임 1개 추가
  addFare();
</script>
</body>
</html>
